server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

schema_config:
  configs:
    - from: 2023-01-01
      store: tsdb
      object_store: filesystem #在容器本地文件系统中进行保存
      schema: v13
      index:
        prefix: index_
        period: 24h

block_builder:
  max_chunk_age: 10s

common:
  storage:
    filesystem:
#      directory: /tmp/loki/data
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules

  path_prefix: /loki
  replication_factor: 1
  compactor_address: http://loki:3100
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

compactor:
  working_directory: /tmp/compactor

querier:
  tail_max_duration: 24h


